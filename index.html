<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243d">
<title>TPQ Nur Fatimah Digital Religius</title>
<style>
:root{--navy:#10243d;--green:#159b70;--bg:#f3f6f8;--ink:#182536;--muted:#718096;--line:#e3e9ee;--white:#fff;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#10243d,#1b4560)}
.login-card{width:min(430px,100%);background:white;padding:30px;border-radius:18px;box-shadow:0 20px 60px #06132355}.logo{width:54px;height:54px;border-radius:15px;background:#e3f5ee;color:#087b58;display:grid;place-items:center;font-size:27px;margin-bottom:16px}.login-card h1{margin:0;font-size:23px}.login-card p{color:var(--muted)}.login-card label,.fields label{display:grid;gap:5px;font-size:12px;font-weight:600;margin:12px 0}.login-card input,.fields input,.fields select,.toolbar input,.fields textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:white}.error{color:var(--red);font-size:12px;min-height:18px}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:var(--navy);color:#dce8f2;padding:22px 15px}.brand{padding:8px 9px 20px;border-bottom:1px solid #ffffff22;margin-bottom:20px}.brand b{display:block;color:#fff}.brand small{color:#91b4c9}.nav button{display:block;width:100%;border:0;background:transparent;color:#c4d4e0;text-align:left;padding:11px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff19;color:#fff}.main{min-width:0}.top{min-height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 26px;gap:12px}.content{padding:26px;max-width:1400px;margin:auto}.muted{color:var(--muted)}h1{font-size:23px;margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:20px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.card small{color:var(--muted)}.card strong{display:block;font-size:26px;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--green);color:#fff;font-weight:650}.btn.alt{background:#edf2f5;color:#33495b}.btn.red{background:#fff0f0;color:#b42318}.toolbar{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap;align-items:center}.toolbar input{max-width:320px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px}th{background:#f8fafb;color:#64748b}.notice{background:#fff8e8;border:1px solid #f1dfb5;color:#785719;padding:13px;border-radius:10px;margin:15px 0}.modal{position:fixed;inset:0;background:#08152599;display:none;place-items:center;padding:15px;z-index:5}.modal.show{display:grid}.dialog{background:#fff;border-radius:15px;padding:20px;width:min(540px,100%);max-height:90vh;overflow:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fields label{display:grid;gap:5px;font-size:12px;margin:4px 0}.fields input,.fields select,.fields textarea{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.status{font-size:11px;color:var(--muted)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{padding:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.content{padding:16px}.top{padding:12px 16px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.fields{grid-template-columns:1fr}.card{padding:12px}.card strong{font-size:22px}}
</style>
</head>
<body>
<div id="login" class="login-wrap"><form id="loginForm" class="login-card"><div class="logo">۞</div><h1>TPQ NUR FATIMAH</h1><b style="color:#159b70">DIGITAL RELIGIUS</b><p>Masuk ke panel administrasi TPQ.</p><label>Email administrator<input id="email" type="email" autocomplete="username" required value="tpq.nurfatimah@gmail.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></label><button class="btn" id="loginBtn" style="width:100%">Masuk</button><div class="error" id="loginError"></div><div class="status">Akses hanya untuk akun yang terdaftar dan aktif.</div></form></div>
<div id="app" class="app" hidden><aside class="side"><div class="brand"><b>۞ TPQ NUR FATIMAH</b><small>DIGITAL RELIGIUS</small></div><nav class="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="students">♙ Data Santri</button><button data-page="teachers">♧ Data Guru</button><button data-page="classes">▤ Kelas</button></nav><p style="font-size:11px;color:#91aabd;margin:22px 9px">MODUL PENGEMBANGAN</p><div style="font-size:12px;color:#c4d4e0;line-height:2;padding:0 10px">Absensi QR · Keuangan · Surat · Akademik · Laporan</div></aside><main class="main"><header class="top"><div><b id="crumb">Dashboard</b><div class="status" id="userLabel"></div></div><button class="btn alt" id="logout">Keluar</button></header><section class="content" id="view"></section></main></div>
<div class="modal" id="modal"><form class="dialog" id="form"><h3 id="formtitle">Tambah data</h3><div class="fields" id="fields"></div><div class="actions"><button type="button" class="btn alt" id="cancel">Batal</button><button class="btn">Simpan</button></div></form></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://jpnuwmxwnablsqxnmyym.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Cc3C2Wgg10JuDi7iOBDl_w_eGXznH-u';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
  global:{fetch:(url,options={})=>{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),15000);
    return fetch(url,{...options,signal:controller.signal})
      .finally(()=>clearTimeout(timer));
  }}
});
const $=s=>document.querySelector(s);let page='dashboard',editing=null,rows={students:[],teachers:[],classes:[]},profile=null;
const configs={
 students:{title:'Data Santri',table:'students',fields:[['student_code','Nomor induk','text',true],['full_name','Nama lengkap','text',true],['gender','Jenis kelamin','select',false],['address','Alamat','text',false],['status','Status','select',false]],columns:['student_code','full_name','gender','address','status']},
 teachers:{title:'Data Guru',table:'teachers',fields:[['teacher_code','ID guru','text',false],['full_name','Nama lengkap','text',true],['phone','Nomor WhatsApp','tel',false],['email','Email','email',false],['position','Jabatan','text',false]],columns:['teacher_code','full_name','phone','email','position']},
 classes:{title:'Data Kelas',table:'classes',fields:[['name','Nama kelas','text',true],['level','Tingkat / jilid','text',false],['notes','Catatan','text',false]],columns:['name','level','notes']}
};
function showLogin(message=''){ $('#login').hidden=false;$('#app').hidden=true;$('#loginError').textContent=message}
async function checkProfile(user){
  const request=supabase.from('profiles')
    .select('id,full_name,role,active')
    .eq('id',user.id)
    .maybeSingle();
  const timeout=new Promise((_,reject)=>setTimeout(
    ()=>reject(new Error('Pemeriksaan profil melebihi 12 detik. Autentikasi berhasil, tetapi akses baca tabel profiles belum merespons. Periksa GRANT SELECT dan kebijakan RLS tabel profiles di Supabase SQL Editor.')),
    12000
  ));
  const {data,error}=await Promise.race([request,timeout]);
  if(error)throw new Error('Gagal membaca profil administrator: '+error.message);
  if(!data)throw new Error('Akun berhasil login, tetapi baris profil tidak ditemukan untuk User ID '+user.id+'. Periksa public.profiles.');
  if(!data.active||data.role!=='admin')throw new Error('Profil ditemukan, tetapi role bukan admin atau status akun tidak aktif.');
  profile=data;
}
async function enter(user){await checkProfile(user);$('#login').hidden=true;$('#app').hidden=false;$('#userLabel').textContent=profile.full_name+' · Administrator';await render()}
async function load(t){const {data,error}=await supabase.from(configs[t].table).select('*').order(t==='classes'?'name':'created_at',{ascending:true});if(error)throw error;rows[t]=data||[]}
function escapeHtml(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dashboard(){return '<h1>Selamat datang di Digital Religius</h1><p class="muted">Administrasi TPQ Nur Fatimah · Data tersimpan di database cloud.</p><div class="stats">'+[['Total Santri',rows.students.length],['Total Guru',rows.teachers.length],['Total Kelas',rows.classes.length],['Status','Online']].map(x=>'<div class="card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel"><b>Database Supabase terhubung</b><p class="muted">Kelola data santri, guru, dan kelas. Modul absensi QR, keuangan, surat menyurat, akademik, dan laporan akan ditambahkan bertahap.</p></div><div class="notice">Versi ini menggunakan autentikasi Supabase dan penyimpanan cloud. Pastikan kebijakan RLS serta backup sudah diuji sebelum menginput data operasional dalam jumlah besar.</div>'}
function tableHtml(t){const c=configs[t],list=rows[t];return '<div class="row"><div><h1>'+c.title+'</h1><span class="muted">Data tersimpan di Supabase</span></div><button class="btn" id="add">＋ Tambah</button></div><div class="toolbar"><input id="search" placeholder="Cari data..."><span class="muted">'+list.length+' data</span></div><div class="tablewrap"><table><thead><tr>'+c.columns.map(k=>'<th>'+c.fields.find(f=>f[0]===k)?.[1]+'</th>').join('')+'<th>Aksi</th></tr></thead><tbody>'+(!list.length?'<tr><td colspan="8" style="text-align:center;padding:25px;color:#718096">Belum ada data.</td></tr>':list.map(r=>'<tr>'+c.columns.map(k=>'<td>'+escapeHtml(r[k])+'</td>').join('')+'<td><button class="btn alt" data-edit="'+r.id+'">Ubah</button> <button class="btn red" data-delete="'+r.id+'">Hapus</button></td></tr>').join(''))+'</tbody></table></div>'}
async function render(){try{if(page==='dashboard'){await Promise.all(['students','teachers','classes'].map(load));$('#view').innerHTML=dashboard();$('#crumb').textContent='Dashboard'}else{await load(page);$('#view').innerHTML=tableHtml(page);$('#crumb').textContent=configs[page].title}}catch(e){$('#view').innerHTML='<div class="notice">Gagal memuat data: '+escapeHtml(e.message)+'</div>'}}
function openForm(id){editing=id||null;const c=configs[page],r=id?rows[page].find(x=>x.id===id):{};$('#formtitle').textContent=(id?'Ubah ':'Tambah ')+c.title;$('#fields').innerHTML=c.fields.map(([k,label,type,required])=>{let options=k==='gender'?['L','P']:k==='status'?['aktif','nonaktif','lulus','pindah']:[];let control=type==='select'?'<select name="'+k+'"><option value="">Pilih</option>'+options.map(o=>'<option value="'+o+'" '+(r[k]===o?'selected':'')+'>'+o+'</option>').join('')+'</select>':'<input name="'+k+'" type="'+type+'" value="'+escapeHtml(r[k]||'').replace(/"/g,'&quot;')+'" '+(required?'required':'')+'>';return '<label>'+label+control+'</label>'}).join('');$('#modal').classList.add('show')}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));await render()}if(b.id==='add')openForm();if(b.dataset.edit)openForm(b.dataset.edit);if(b.dataset.delete){if(confirm('Hapus data ini secara permanen?')){const {error}=await supabase.from(configs[page].table).delete().eq('id',b.dataset.delete);if(error)alert(error.message);await render()}}});
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('#loginBtn'),msg=$('#loginError');
  btn.disabled=true;msg.textContent='Menghubungi server autentikasi...';
  try{
    const {data,error}=await supabase.auth.signInWithPassword({
      email:$('#email').value.trim(),password:$('#password').value
    });
    if(error) throw error;
    msg.textContent='Login berhasil. Memeriksa hak akses administrator...';
    await enter(data.user);
  }catch(err){
    const timed=err?.name==='AbortError'||/abort/i.test(err?.message||'');
    msg.textContent=timed
      ?'Koneksi ke Supabase melewati batas 15 detik. Periksa internet dan konfigurasi URL/API key, lalu coba lagi.'
      :(err?.message||'Login gagal. Periksa koneksi dan konfigurasi Supabase.');
    console.error('TPQ login diagnostic:',err);
    try{await supabase.auth.signOut()}catch(_){}
  }finally{btn.disabled=false}
});
$('#logout').onclick=async()=>{await supabase.auth.signOut();profile=null;showLogin()};
$('#cancel').onclick=()=>$('#modal').classList.remove('show');
$('#form').onsubmit=async e=>{e.preventDefault();const payload=Object.fromEntries(new FormData(e.currentTarget));Object.keys(payload).forEach(k=>{if(payload[k]==='')payload[k]=null});let q=editing?supabase.from(configs[page].table).update(payload).eq('id',editing):supabase.from(configs[page].table).insert(payload);const {error}=await q;if(error){alert('Gagal menyimpan: '+error.message);return}$('#modal').classList.remove('show');await render()};
$('#view').addEventListener('input',e=>{if(e.target.id==='search'){const term=e.target.value.toLowerCase(),c=configs[page];const list=rows[page].filter(r=>c.columns.some(k=>String(r[k]??'').toLowerCase().includes(term)));const tbody=$('#view tbody');if(tbody)tbody.innerHTML=list.length?list.map(r=>'<tr>'+c.columns.map(k=>'<td>'+escapeHtml(r[k])+'</td>').join('')+'<td><button class="btn alt" data-edit="'+r.id+'">Ubah</button> <button class="btn red" data-delete="'+r.id+'">Hapus</button></td></tr>').join(''):'<tr><td colspan="8">Tidak ditemukan.</td></tr>'}});
const {data:{session}}=await supabase.auth.getSession();if(session){try{await enter(session.user)}catch(e){await supabase.auth.signOut();showLogin(e.message)}}else showLogin();
supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showLogin()});
</script></body></html>
