<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243d"><title>TPQ Nur Fatimah Digital Religius</title>
<style>
:root{--navy:#10243d;--navy2:#183451;--green:#159b70;--bg:#f3f6f8;--ink:#182536;--muted:#718096;--line:#e3e9ee;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:var(--navy);color:#dce8f2;padding:22px 15px}.brand{padding:8px 9px 20px;border-bottom:1px solid #ffffff22;margin-bottom:20px}.brand b{display:block;color:#fff}.brand small{color:#91b4c9}.nav button{display:block;width:100%;border:0;background:transparent;color:#c4d4e0;text-align:left;padding:11px;border-radius:9px;margin:3px 0;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff19;color:#fff}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}.content{padding:26px;max-width:1400px;margin:auto}.muted{color:var(--muted)}h1{font-size:23px;margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:20px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.card small{color:var(--muted)}.card strong{display:block;font-size:26px;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--green);color:#fff;font-weight:650;cursor:pointer}.btn.alt{background:#edf2f5;color:#33495b}.btn.red{background:#fff0f0;color:#b42318}.toolbar{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}input,select{padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px}th{background:#f8fafb;color:#64748b}.notice{background:#fff8e8;border:1px solid #f1dfb5;color:#785719;padding:13px;border-radius:10px;margin:15px 0}.modal{position:fixed;inset:0;background:#08152599;display:none;place-items:center;padding:15px}.modal.show{display:grid}.dialog{background:#fff;border-radius:15px;padding:20px;width:min(480px,100%)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields label{display:grid;gap:5px;font-size:12px}.fields input,.fields select{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hide{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}.side{padding:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.content{padding:16px}.top{padding:0 16px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.fields{grid-template-columns:1fr}.card{padding:12px}.card strong{font-size:22px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>۞ TPQ NUR FATIMAH</b><small>DIGITAL RELIGIUS</small></div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="santri">♙ Data Santri</button><button data-page="guru">♧ Data Guru</button><button data-page="kelas">▤ Kelas</button></nav><p style="font-size:11px;color:#91aabd;margin:22px 9px">MODUL BERIKUTNYA</p><div style="font-size:12px;color:#c4d4e0;line-height:2;padding:0 10px">Absensi QR · Keuangan · Surat · Akademik · Laporan · Pengaturan</div><p style="font-size:10px;color:#91aabd;margin:30px 9px">Versi awal 0.1 · Data lokal</p></aside><main class="main"><header class="top"><b id="crumb">Dashboard</b><span style="font-size:12px;color:#718096">Administrator · TPQ Nur Fatimah</span></header><section class="content" id="view"></section></main></div>
<div class="modal" id="modal"><form class="dialog" id="form"><h3 id="formtitle">Tambah data</h3><div class="fields" id="fields"></div><div class="actions"><button type="button" class="btn alt" id="cancel">Batal</button><button class="btn">Simpan</button></div></form></div>
<script>
const KEY='tpq_nur_fatimah_digital_religius_v01';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{santri:[],guru:[],kelas:[]}}catch{data={santri:[],guru:[],kelas:[]}}let page='dashboard',editId=null;
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defs={santri:{title:'Data Santri',fields:[['nama','Nama lengkap','text'],['nis','Nomor induk','text'],['jk','Jenis kelamin','select'],['wali','Nama wali','text'],['telepon','WhatsApp wali','tel'],['kelas','Kelas','text']]},guru:{title:'Data Guru',fields:[['nama','Nama lengkap','text'],['idguru','ID guru','text'],['jabatan','Jabatan','text'],['telepon','WhatsApp','tel']]},kelas:{title:'Data Kelas',fields:[['nama','Nama kelas','text'],['tingkat','Tingkat/jilid','text'],['guru','Guru pengampu','text'],['tahun','Tahun ajaran','text']]}};
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function dashboard(){return '<h1>Selamat datang di Digital Religius</h1><p class="muted">Administrasi TPQ Nur Fatimah dalam satu aplikasi.</p><div class="stats">'+[['Total Santri',data.santri.length],['Total Guru',data.guru.length],['Total Kelas',data.kelas.length],['Modul utama','10']].map(x=>'<div class="card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel"><b>Fondasi aplikasi berhasil dimuat</b><p class="muted">Kelola data santri, guru, dan kelas melalui menu di samping. Modul absensi QR, keuangan, surat menyurat, akademik, dan laporan akan ditambahkan bertahap.</p></div><div class="notice"><b>Catatan penting:</b> Versi ini menyimpan data di browser/perangkat ini saja. Belum ada login aman atau sinkronisasi cloud. Jangan gunakan untuk data operasional penting sebelum integrasi Supabase dan autentikasi selesai.</div>'}
function rows(t,arr){if(!arr.length)return '<tr><td colspan="8" style="text-align:center;padding:28px;color:#718096">Belum ada data.</td></tr>';return arr.map(r=>'<tr>'+defs[t].fields.map(f=>'<td>'+safe(r[f[0]]||'—')+'</td>').join('')+'<td><button class="btn alt" data-edit="'+r.id+'">Ubah</button> <button class="btn red" data-del="'+r.id+'">Hapus</button></td></tr>').join('')}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=page==='dashboard'?'Dashboard':defs[page].title;let d=defs[page];$('#view').innerHTML=page==='dashboard'?dashboard():'<div class="row"><div><h1>'+d.title+'</h1><span class="muted">Kelola data '+d.title.toLowerCase()+'</span></div><button class="btn" id="add">＋ Tambah</button></div><div class="toolbar"><input id="search" placeholder="Cari data..."><span class="muted">'+data[page].length+' data</span></div><div class="tablewrap"><table><thead><tr>'+d.fields.map(f=>'<th>'+f[1]+'</th>').join('')+'<th>Aksi</th></tr></thead><tbody id="tbody">'+rows(page,data[page])+'</tbody></table></div>'}
function openForm(id){editId=id||null;let d=defs[page],r=id?data[page].find(x=>x.id===id):{};$('#formtitle').textContent=(id?'Ubah ':'Tambah ')+d.title;$('#fields').innerHTML=d.fields.map(f=>'<label>'+f[1]+(f[0]==='nama'?' *':'')+(f[2]==='select'?'<select name="'+f[0]+'"><option value="">Pilih</option><option '+(r[f[0]]==='Laki-laki'?'selected':'')+'>Laki-laki</option><option '+(r[f[0]]==='Perempuan'?'selected':'')+'>Perempuan</option></select>':'<input name="'+f[0]+'" type="'+f[2]+'" value="'+safe(r[f[0]]||'')+'" '+(f[0]==='nama'?'required':'')+'>')+'</label>').join('');$('#modal').classList.add('show')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.id==='add')openForm();if(b.dataset.edit)openForm(b.dataset.edit);if(b.dataset.del&&confirm('Hapus data ini?')){data[page]=data[page].filter(x=>x.id!==b.dataset.del);persist();render()}});
$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#form').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.currentTarget));if(editId){let i=data[page].findIndex(x=>x.id===editId);data[page][i]={...data[page][i],...obj}}else data[page].push({id:crypto.randomUUID(),...obj});persist();$('#modal').classList.remove('show');render()};
document.addEventListener('input',e=>{if(e.target.id==='search'){let term=e.target.value.toLowerCase(),arr=data[page].filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(term)));$('#tbody').innerHTML=rows(page,arr)}});render();
</script></body></html>
